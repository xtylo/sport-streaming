# Spring Boot application configuration.

server.port=8080
spring.application.name=streaming-service
spring.kafka.bootstrap-servers=localhost:9092

# SSE heartbeat interval (ms)
streaming.sse.heartbeat-ms=15000

# Kafka topic for match events (key = matchId -> ordering per match)
streaming.kafka.topic=match-events
streaming.kafka.partitions=6
streaming.kafka.replicas=1
# Max time POST /events waits for the broker ack before answering 503
streaming.kafka.send-timeout=5s

# --- Producer tuning (see docs/adr/0002) ---
# Durability: wait for all in-sync replicas; idempotence (no duplicates on retry) is on by default
spring.kafka.producer.acks=all
# Latency vs throughput: wait up to 5 ms to batch concurrent sends (Kafka 4 default, made explicit)
spring.kafka.producer.properties.linger.ms=5
# Cheap CPU-wise; pays off on batches under load
spring.kafka.producer.compression-type=lz4
# Fail fast when the broker is down, aligned with streaming.kafka.send-timeout (5s).
# max.block.ms bounds send() itself (waiting for metadata); delivery.timeout.ms bounds retries.
# Constraint: delivery.timeout.ms >= linger.ms + request.timeout.ms
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=4000
spring.kafka.producer.properties.delivery.timeout.ms=5000

# Consumer: a new consumer group starts from the beginning of the topic,
# so each instance rebuilds the match state on startup (see MatchEventConsumer)
spring.kafka.consumer.auto-offset-reset=earliest
