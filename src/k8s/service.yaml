# Load-balances requests across the streaming-service pods.
# NodePort 30080 is mapped to the dev container's localhost:30080 (see kind-cluster.yaml).
# On EKS this becomes an Ingress/ALB (Day 8).
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: streaming
  labels:
    app.kubernetes.io/name: streaming-service
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: streaming-service
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
