# OpenTelemetry backend (collector + Tempo + Prometheus + Loki + Grafana) for the EKS demo.
# Same image as docker-compose.yml. Not exposed to the internet:
#   kubectl -n streaming port-forward svc/lgtm 3000:3000   ->  http://localhost:3000 (admin/admin)
# Data is ephemeral (emptyDir): fine for a one-hour demo.
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: streaming
  labels:
    app.kubernetes.io/name: lgtm
spec:
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: streaming
  labels:
    app.kubernetes.io/name: lgtm
    app.kubernetes.io/part-of: sport-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.30.0
          ports:
            - containerPort: 3000
            - containerPort: 4317
            - containerPort: 4318
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
