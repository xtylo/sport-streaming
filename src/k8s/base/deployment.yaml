apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  namespace: streaming
  labels:
    app.kubernetes.io/name: streaming-service
    app.kubernetes.io/part-of: sport-streaming
spec:
  replicas: 2 # the HPA takes over the replica count once it is applied
  selector:
    matchLabels:
      app.kubernetes.io/name: streaming-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the desired replicas during a deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streaming-service
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45

      # Don't start the app before Kafka accepts connections (the topic is created on startup).
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: streaming-service
          image: streaming-service:dev
          imagePullPolicy: IfNotPresent # loaded with "kind load docker-image"; never pulled
          ports:
            - name: http
              containerPort: 8080

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # /actuator/health/liveness and /readiness (on by default in Kubernetes; explicit here)
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=kind,k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME)
          # OTLP endpoint (the LGTM container outside the cluster); created with kubectl, see docs.
          envFrom:
            - configMapRef:
                name: streaming-otel
                optional: true

          # Sized from the Day 6 measurements (docs/RESULTS.md):
          # - CPU request = typical use at the expected load (0.3–0.5 cores at 300 req/s).
          #   The scheduler reserves it and the HPA's 60% target is relative to it.
          # - No CPU limit: avoids CFS throttling; the pod may burst on JVM start/JIT.
          # - Memory request = limit ("Guaranteed" memory): the JVM rarely returns memory, so
          #   reserving less than it can use would overcommit the node.
          #   Heap = 65% of the limit (Dockerfile); the rest is metaspace, threads, buffers, agent.
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 768Mi

          # Slow start (JVM + Kafka replay): liveness/readiness only begin after startup succeeds.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36 # up to 3 minutes
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # Tomcat and the JVM need a writable /tmp
      volumes:
        - name: tmp
          emptyDir: {}
