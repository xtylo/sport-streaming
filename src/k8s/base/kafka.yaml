# Single-broker Kafka (KRaft) inside the cluster, for local/demo use.
# In production: Amazon MSK or a Kafka operator (e.g. Strimzi) with 3+ brokers.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: streaming
  labels:
    app.kubernetes.io/name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: streaming
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: sport-streaming
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      # Without this, Kubernetes injects KAFKA_PORT=tcp://... (Docker-link style env vars for
      # the "kafka" Service), and the image turns every KAFKA_* variable into broker config.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000 # the apache/kafka image runs as uid 1000; lets it write to the volume
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - name: client
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: CLUSTER_ID
              value: 4L6g3nShT-eMCtK--X86sw
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # Clients inside the cluster reach the broker through the Service DNS name
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.streaming.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_NUM_PARTITIONS
              value: "6"
            # Data on the persistent volume: events survive a Kafka pod restart
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  # One PersistentVolumeClaim per pod (kind provides the "standard" local-path StorageClass)
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
