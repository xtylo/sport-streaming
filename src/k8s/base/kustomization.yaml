# Base manifests shared by every environment (kind, EKS).
# Environments reference this folder; it must not contain them (Kustomize rejects cycles).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - kafka.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
