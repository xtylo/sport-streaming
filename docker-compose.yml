# Local development stack.
# Run from the repo root (inside the dev container):  docker compose up -d
#
# Day 3: Kafka (single broker, KRaft mode - no ZooKeeper)
# Day 4: grafana/otel-lgtm (OpenTelemetry collector + Grafana) will be added here
# Day 5: the streaming-service container will be added here

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092" # for clients on the host / dev container (the Spring app, CLI tools)
    environment:
      # --- KRaft: this single node is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: sport-streaming-local-01

      # --- Listeners ---
      # PLAINTEXT       -> other containers on the compose network (kafka:29092), used on Day 5
      # PLAINTEXT_HOST  -> the dev container / host (localhost:9092), used by the app today
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single-node settings (no replication possible with one broker) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Topics are created explicitly by the app (NewTopic bean), not on first use ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Optional: LocalStack for AWS APIs that the free tier supports (S3, IAM, ...).
  # EKS and MSK emulation are NOT available in the free tier - see docs/PLAN.md.
